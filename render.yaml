# UK Rail Viz — Render blueprint (SPEC.md §7.1)
# Static site on the free tier: CDN-served, brotli, no server, no spin-down.
# Create via Dashboard → New → Blueprint (link this repo); the CLI has no
# `blueprint launch` (render v2.22.0) — `render blueprints validate render.yaml` checks this file.

services:
  - type: web
    name: ukrail-viz
    runtime: static
    branch: prod                 # deploy branch — Render auto-deploys ONLY this (see §7.2)
    buildCommand: npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/live.json
        name: Cache-Control
        value: public, max-age=900
      - path: /data/station-frequency.json
        name: Cache-Control
        value: public, max-age=900
      - path: /data/*.json
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: Cache-Control
        value: public, max-age=300
