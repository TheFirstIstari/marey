name: refresh-uk-rail-data

# $0 refresh pipeline (SPEC.md §7.2): fetch Darwin → derive artifacts → commit data/
# → git push → Render auto-deploys the static site (CDN invalidates on deploy).
# Credentials via GitHub repo secrets (mirror into Render env for the blueprint):
#   DARWIN_S3_KEY_ID, DARWIN_S3_SECRET, NROD_USER, NROD_PASS, and GH_PAT (repo scope)
#   for the commit+push step. Until secrets exist the pipeline keeps fixtures green.

on:
  schedule:
    - cron: '*/15 * * * *'      # live overlay cadence (SPEC.md D2 default: 15 min)
  workflow_dispatch: {}
  push:
    paths: ['data/**']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install --no-audit --no-fund

      - name: Collect (skips cleanly without secrets)
        run: npm run collect
        env:
          DARWIN_S3_KEY_ID: ${{ secrets.DARWIN_S3_KEY_ID }}
          DARWIN_S3_SECRET: ${{ secrets.DARWIN_S3_SECRET }}
          NROD_USER: ${{ secrets.NROD_USER }}
          NROD_PASS: ${{ secrets.NROD_PASS }}

      - name: Derive artifacts
        run: npm run derive

      - name: Smoke-test artifacts
        run: npm run smoke

      - name: Commit data changes
        run: |
          git config user.name "uk-rail-viz bot"
          git config user.email "bot@ukrailviz.local"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/ raw/ 2>/dev/null || git add data/
            git commit -m "chore(data): refresh rail data [skip render]"
            git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF##*/}
          else
            echo "no data changes — nothing to push"
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Upload raw archive (optional retention)
        uses: actions/upload-artifact@v4
        with:
          name: darwin-raw-${{ github.run_id }}
          path: raw/
          retention-days: 14
          if-no-files-found: ignore
