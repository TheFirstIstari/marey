name: refresh-uk-rail-data

# $0 refresh pipeline (SPEC.md §7.2): fetch Darwin → derive artifacts →
# test → build → commit data/ → FF-push main → auto-deploy prod → Render.
# Credentials via GitHub repo secrets (mirror into Render env for the blueprint):
#   DARWIN_S3_KEY_ID, DARWIN_S3_SECRET, NROD_USER, NROD_PASS, R2_ENDPOINT,
#   R2_BUCKET, R2_PROFILE, and GH_PAT (repo scope) for the commit+push step.
# Until secrets exist the pipeline keeps fixtures green.

on:
  schedule:
    - cron: '*/15 * * * *'      # live overlay cadence (SPEC.md D2 default: 15 min)
    - cron: '5 3 * * *'         # daily timetable + R2 mirror + HSP history
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['data/**']

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect (skips cleanly without secrets)
        run: npm run collect
        env:
          DARWIN_S3_KEY_ID: ${{ secrets.DARWIN_S3_KEY_ID }}
          DARWIN_S3_SECRET: ${{ secrets.DARWIN_S3_SECRET }}
          NROD_USER: ${{ secrets.NROD_USER }}
          NROD_PASS: ${{ secrets.NROD_PASS }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PROFILE: ${{ secrets.R2_PROFILE }}
          FETCH_AUX: 1

      - name: Derive artifacts
        run: npm run derive

      - name: Verify (smoke + build + unit tests — data stays derived)
        run: node tools/smoke-test.js && npm run build && node --test tests/*.test.js

      - name: Build and budget check
        run: npm run build

      - name: Commit data changes
        run: |
          git config user.name "uk-rail-viz bot"
          git config user.email "bot@ukrailviz.local"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore(data): refresh rail data [skip render]"
            git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "no data changes — nothing to commit"
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: FF-push main → prod (deploy branch)
        run: |
          git push origin main:prod || true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Upload raw archive (optional retention)
        uses: actions/upload-artifact@v4
        with:
          name: darwin-raw-${{ github.run_id }}
          path: raw/
          retention-days: 14
          if-no-files-found: ignore
